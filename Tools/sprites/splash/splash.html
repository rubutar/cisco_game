<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Press+Start+2P&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1d1b33}
.f{position:relative;width:1920px;height:1080px;overflow:hidden}
.map{position:absolute;inset:0;width:1920px;height:1080px;image-rendering:pixelated;filter:saturate(1.15) brightness(1.02)}
.tint{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 62%, rgba(29,27,51,0) 55%, rgba(29,27,51,.38) 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(71,230,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(71,230,255,.07) 2px,transparent 2px);background-size:64px 64px}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(29,27,51,.06) 0 2px,transparent 2px 6px)}
svg{position:absolute;inset:0}
.glow{fill:none;stroke:#47e6ff;stroke-width:22;opacity:.28;filter:blur(6px)}
.core{fill:none;stroke:#47e6ff;stroke-width:6;stroke-dasharray:18 12}
.top{position:absolute;left:0;right:0;top:0;height:440px;background:linear-gradient(180deg,rgba(29,27,51,.88) 0%,rgba(29,27,51,.6) 50%,rgba(29,27,51,0) 100%)}
.bottom{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(0deg,rgba(29,27,51,.7) 0%,rgba(29,27,51,0) 100%)}
.logo{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:'Press Start 2P';font-size:148px;line-height:1;letter-spacing:4px;color:#fff4d6;
 -webkit-text-stroke:22px #1d1b33;paint-order:stroke fill;
 text-shadow:0 18px 0 #1d1b33,0 0 60px rgba(71,230,255,.55)}
.logo b{color:#47e6ff} .logo i{font-style:normal;color:#47e6ff}
.tag{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:Nunito;font-weight:800;font-size:44px;color:#ffd23f;letter-spacing:2px}
.tag span{background:#1d1b33;padding:8px 26px;border-radius:30px;border:4px solid #47e6ff}
.cast{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;align-items:flex-end;gap:34px}
.cast img{image-rendering:pixelated}
.b{width:128px;height:128px} .pax{width:224px;height:224px;margin:0 30px}
.hop1{transform:translateY(-14px)} .hop2{transform:translateY(-6px)}
.shadow{filter:drop-shadow(0 8px 0 rgba(29,27,51,.45))}
.corner{position:absolute;width:70px;height:70px;border:8px solid #47e6ff;opacity:.85}
.press{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-family:'Pixelify Sans';font-size:34px;color:#fff4d6;opacity:.85}
</style></head><body><div class="f">
<img class="map" src="town_clean.png">
<div class="grid"></div>
<svg width="1920" height="1080" viewBox="0 0 1920 1080"><circle cx="960" cy="470" r="120" fill="none" stroke="#47e6ff" stroke-width="8" stroke-dasharray="24 16" opacity="0.9"/><circle cx="960" cy="470" r="190" fill="none" stroke="#47e6ff" stroke-width="8" stroke-dasharray="24 16" opacity="0.6"/><circle cx="960" cy="470" r="270" fill="none" stroke="#47e6ff" stroke-width="8" stroke-dasharray="24 16" opacity="0.35"/><circle cx="960" cy="470" r="360" fill="none" stroke="#47e6ff" stroke-width="8" stroke-dasharray="24 16" opacity="0.18"/></svg>
<div class="tint"></div>
<div class="top"></div><div class="bottom"></div>
<div class="logo">BYTE <i>WORLD</i></div>
<div class="tag"><span>A tiny world living inside your network</span></div>
<div class="cast shadow">

<img class="pax" src="../hifi/pax_walk.png">

</div>
<div class="corner" style="left:28px;top:28px;border-right:0;border-bottom:0"></div>
<div class="corner" style="right:28px;top:28px;border-left:0;border-bottom:0"></div>
<div class="corner" style="left:28px;bottom:28px;border-right:0;border-top:0"></div>
<div class="corner" style="right:28px;bottom:28px;border-left:0;border-top:0"></div>
</div></body></html>
